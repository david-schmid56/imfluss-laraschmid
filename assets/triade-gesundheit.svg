<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Die Triade der Gesundheit: ein Dreieck aus Biochemie, Psyche und Biomechanik. In der Mitte die Energie, an der Spitze die Muskelfunktion als verbindendes Element.">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9a8f7a"/>
    </marker>
  </defs>

  <!-- Umkreis -->
  <circle cx="320" cy="235" r="150" fill="none" stroke="#e2d8c4" stroke-width="1.5"/>

  <!-- Dreieck: jede Seite ein Bereich -->
  <line x1="320" y1="85"  x2="190" y2="310" stroke="#9cb380" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="85"  x2="450" y2="310" stroke="#e8b53d" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="310" x2="450" y2="310" stroke="#8a7a5e" stroke-width="4" stroke-linecap="round"/>

  <!-- Qi in der Mitte, mit Bezug zu allen drei Seiten -->
  <circle cx="320" cy="235" r="52" fill="#faf6ec" stroke="#e2d8c4" stroke-width="1"/>
  <text x="320" y="230" text-anchor="middle" font-family="DM Sans, sans-serif"
        font-size="21" font-weight="600" fill="#3d3528">Qi</text>
  <text x="320" y="250" text-anchor="middle" font-family="DM Sans, sans-serif"
        font-size="11" font-weight="500" fill="#6f6555" letter-spacing="1.2">ENERGIE</text>

  <line x1="286" y1="205" x2="252" y2="180" stroke="#9a8f7a" stroke-width="1.2" marker-end="url(#ar)" opacity="0.75"/>
  <line x1="354" y1="205" x2="388" y2="180" stroke="#9a8f7a" stroke-width="1.2" marker-end="url(#ar)" opacity="0.75"/>
  <line x1="320" y1="288" x2="320" y2="300" stroke="#9a8f7a" stroke-width="1.2" marker-end="url(#ar)" opacity="0.75"/>

  <!-- Spitze: Muskelfunktion -->
  <circle cx="320" cy="85" r="6" fill="#3d3528"/>
  <text x="320" y="62" text-anchor="middle" font-family="DM Sans, sans-serif"
        font-size="15" font-weight="600" fill="#3d3528">Muskelfunktion</text>
  <text x="320" y="40" text-anchor="middle" font-family="DM Sans, sans-serif"
        font-size="11" font-weight="500" fill="#9cb380" letter-spacing="1.4">DAS VERBINDENDE ELEMENT</text>

  <!-- Seitenbeschriftungen -->
  <text transform="translate(232,198) rotate(-60)" text-anchor="middle"
        font-family="DM Sans, sans-serif" font-size="15" font-weight="600" fill="#6d8a55">Biochemie</text>
  <text transform="translate(408,198) rotate(60)" text-anchor="middle"
        font-family="DM Sans, sans-serif" font-size="15" font-weight="600" fill="#b8891f">Psyche</text>
  <text x="320" y="333" text-anchor="middle" font-family="DM Sans, sans-serif"
        font-size="15" font-weight="600" fill="#8a7a5e">Biomechanik</text>

  <!-- Stichworte zu den Seiten -->
  <text x="150" y="243" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11.5" fill="#6f6555">
    <tspan x="150" dy="0">Ernährung</tspan>
    <tspan x="150" dy="15">Stoffwechsel</tspan>
    <tspan x="150" dy="15">Hormonsystem</tspan>
  </text>
  <text x="492" y="243" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11.5" fill="#6f6555">
    <tspan x="492" dy="0">Einstellungen</tspan>
    <tspan x="492" dy="15">Emotionen</tspan>
    <tspan x="492" dy="15">Gedanken</tspan>
  </text>
  <text x="320" y="360" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11.5" fill="#6f6555">
    <tspan x="320" dy="0">Muskeln · Bänder · Sehnen</tspan>
    <tspan x="320" dy="15">Haltung und Bewegung</tspan>
  </text>
</svg>
